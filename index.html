<!doctype html>
<html lang="th">

<head>
  <base target="_top" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AUT CMMS Service</title>
  
  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

  <style>
    .hidden {
      display: none !important;
    }
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
    }
  </style>
</head>

<body class="bg-gray-50">

  <!-- 1. Full Screen Loading Overlay (เปิดทำงานทันทีตั้งแต่แรก) -->
  <div id="loadingOverlay" class="fixed inset-0 bg-white/95 backdrop-blur-sm z-50 flex flex-col items-center justify-center p-4">
    <div class="relative flex items-center justify-center">
      <div class="w-14 h-14 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>
      <i class="fa-solid fa-wrench text-blue-600 text-sm absolute"></i>
    </div>
    <p id="loadingText" class="mt-4 text-xs font-semibold text-gray-600 animate-pulse">กำลังเริ่มต้นระบบ...</p>
  </div>

  <!-- 2. หน้า Login Section (แสดงเฉพาะเปิดผ่าน Browser ทั่วไป) -->
  <div id="login-section" class="flex min-h-screen items-center justify-center px-4 py-12 sm:px-6 lg:px-8 bg-gradient-to-br from-blue-50 via-white to-indigo-50 hidden">
    <div class="w-full max-w-sm space-y-6">
      <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
        <div class="text-center mb-8">
          <div class="w-16 h-16 rounded-2xl bg-blue-600 text-white flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/30">
            <i class="fa-solid fa-gear text-2xl"></i>
          </div>
          <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight">AUT CMMS</h1>
          <p id="subTitlePage" class="text-xs text-gray-400 mt-1 font-medium">Smart Service Management</p>
        </div>

        <div class="space-y-4">
          <div>
            <label for="username" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5 pl-1">Username</label>
            <input id="username" type="text" required
              class="w-full rounded-xl border border-gray-200 bg-gray-50 py-2.5 px-4 text-sm text-gray-900 placeholder:text-gray-400 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none transition-all"
              placeholder="ชื่อผู้ใช้งาน"
              onkeydown="if(event.key==='Enter') loginUser()">
          </div>
          <div>
            <label for="password" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5 pl-1">Password</label>
            <input id="password" type="password" required
              class="w-full rounded-xl border border-gray-200 bg-gray-50 py-2.5 px-4 text-sm text-gray-900 placeholder:text-gray-400 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none transition-all"
              placeholder="รหัสผ่าน"
              onkeydown="if(event.key==='Enter') loginUser()">
          </div>
        </div>

        <div id="error-msg" class="mt-4 bg-red-50 border border-red-200 text-red-600 text-xs text-center py-2.5 rounded-xl hidden font-medium">
          <i class="fa-solid fa-circle-exclamation mr-1"></i> <span id="error-text">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</span>
        </div>

        <button onclick="loginUser()" id="btn-login"
          class="mt-6 w-full py-2.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-sm rounded-xl shadow-md shadow-blue-600/20 transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket text-xs"></i>
          <span id="btn-text">เข้าสู่ระบบ</span>
        </button>
      </div>

      <p class="text-center text-[10px] text-gray-400 font-medium">AUT CMMS v6.0 &copy; 2026</p>
    </div>
  </div>

  <!-- 3. ส่วนแสดง App / Iframe เมื่อยืนยันตัวตนเรียบร้อย -->
  <div id="app-section" class="hidden">
    <iframe id="formframe" src="" frameborder="0" ></iframe>
  </div>

  <script>
    // Config ค่าจากระบบ
    const LIFF_ID = "2011050588-FTDVMv4L"; // ใส่ LIFF ID ของคุณ
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxZglcxsfWA4M8vTUOJWVqzQbWDpNzy2EVozbA4dZPAWrk8ZTnk58yDjb9XgnhZVy_bmw/exec"; // URL Web App ของ GAS
  
    window.onload = function() {
      checkSessionAndAuth();
    };


    async function checkSessionAndAuth() {
      // 1. ตรวจสอบว่ามี Session ค้างไว้ใน Browser หรือไม่
      const savedSession = localStorage.getItem("userSession");
      if (savedSession) {
        showLoading("กำลังเข้าสู่ระบบ...");
        const userData = JSON.parse(savedSession);
        renderApp(userData);
        return;
      }

      // 2. ถ้าไม่มี Session ให้ตรวจสอบผ่าน LIFF
      try {
        showLoading("กำลังเชื่อมต่อระบบ LINE...");
        await liff.init({ liffId: LIFF_ID });

        if (liff.isLoggedIn()) {
          showLoading("กำลัง ตรวจสอบสิทธิ์การใช้งาน...");
          const idToken = liff.getIDToken();

          if (idToken) {
            const response = await fetch(GAS_WEBAPP_URL, {
              method: "POST",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify({
                action: "verifyLiffToken",
                idToken: idToken
              })
            });

            const res = await response.json();
            if (res.success) {
              saveSessionAndRender(res.user);
            } else {
              console.error("Token verification failed:", res.message);
              showLoginForm();
            }
          } else {
            showLoginForm();
          }

        } else if (liff.isInClient()) {
          liff.login();
        } else {
          // เปิดผ่าน Browser ทั่วไป ให้แสดงหน้า Login Form
          showLoginForm();
        }

      } catch (err) {
        console.log("LIFF Init Error or Browser Mode:", err);
        showLoginForm();
      }
    }

    // ฟังก์ชัน Login สำหรับ Browser ทั่วไป
async function loginUser() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  const errorMsg = document.getElementById('error-msg');
  const btnText = document.getElementById('btn-text');

  if (!u || !p) {
    showError("กรุณากรอก Username และ Password");
    return;
  }

  errorMsg.classList.add('hidden');
  btnText.textContent = "กำลังตรวจสอบ...";

  try {
    const response = await fetch(GAS_WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "checkUserLogin",
        username: u,
        password: p
      })
    });

    const res = await response.json();
    if (res.success) {
      saveSessionAndRender(res.user);
    } else {
      showError(res.message || "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");
    }
  } catch (err) {
    console.error("Login Error:", err);
    showError("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์");
  } finally {
    // เปลี่ยนจาก font-medium { ... } เป็น finally { ... }
    btnText.textContent = "เข้าสู่ระบบ";
  }
}

    function saveSessionAndRender(user) {
      localStorage.setItem("userSession", JSON.stringify(user));
      renderApp(user);
    }

    function renderApp(user) {
      showLoading("กำลังโหลดหน้าระบบ...");
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('app-section').classList.remove('hidden');

      hideLoading();     
      const targetIframeUrl = `${GAS_WEBAPP_URL}?userId=${encodeURIComponent(user.userId || '')}`;
      document.getElementById('formframe').src = targetIframeUrl;
    }


    function showLoginForm() {
      hideLoading();
      document.getElementById('app-section').classList.add('hidden');
      document.getElementById('login-section').classList.remove('hidden');
    }

    function showError(msg) {
      const errorMsg = document.getElementById('error-msg');
      document.getElementById('error-text').textContent = msg;
      errorMsg.classList.remove('hidden');
    }

    function logout() {
      localStorage.removeItem("userSession");
      if (typeof liff !== 'undefined' && liff.isLoggedIn && liff.isLoggedIn()) {
        liff.logout();
      }
      location.reload();
    }

    function showLoading(text) {
      const overlay = document.getElementById("loadingOverlay");
      const textEl = document.getElementById("loadingText");
      if (textEl) textEl.innerText = text || "กำลังโหลดข้อมูล...";
      if (overlay) overlay.classList.remove("hidden");
    }

    function hideLoading() {
      const overlay = document.getElementById("loadingOverlay");
      if (overlay) overlay.classList.add("hidden");
    }
  </script>
</body>

</html>
