<script>

const LIFF_ID = '2011045112-nTERJAZu';

// URL Web App ของ Google Apps Script
const GAS_URL =
  'https://script.google.com/macros/s/XXXXXXXXXXXX/exec';


let currentUser = null;
let currentIdToken = null;


/**
 * ==========================================
 * เริ่มต้นระบบ
 * ==========================================
 */
async function initApp() {

  try {

    console.log('Starting LIFF...');


    // ------------------------------------------
    // LIFF Init
    // ------------------------------------------

    await liff.init({
      liffId: LIFF_ID
    });


    console.log('LIFF initialized');


    // ------------------------------------------
    // ตรวจสอบ Login
    // ------------------------------------------

    if (!liff.isLoggedIn()) {

      console.log(
        'LINE user not logged in'
      );

      liff.login();

      return;
    }


    // ------------------------------------------
    // ขอ ID Token
    // ------------------------------------------

    const idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        'ไม่สามารถรับ LINE ID Token ได้'
      );

    }


    currentIdToken =
      idToken;


    console.log(
      'LINE ID Token received'
    );


    // ------------------------------------------
    // Decode สำหรับแสดง UI เท่านั้น
    //
    // สำคัญ:
    // ข้อมูลตรงนี้ "ห้ามใช้ยืนยันตัวตน"
    // ------------------------------------------

    const decoded =
      liff.getDecodedIDToken();


    if (decoded) {

      currentUser = {

        userId:
          decoded.sub || '',

        displayName:
          decoded.name || '',

        pictureUrl:
          decoded.picture || ''

      };


      // แสดง Profile

      const profileImage =
        document.getElementById(
          'profileImage'
        );


      const displayName =
        document.getElementById(
          'displayName'
        );


      if (profileImage) {

        profileImage.src =
          currentUser.pictureUrl || '';

      }


      if (displayName) {

        displayName.textContent =
          currentUser.displayName || '';

      }

    }


    // ------------------------------------------
    // ตรวจสอบ User กับ GAS
    //
    // ไม่ส่ง userId แล้ว
    // ส่งเฉพาะ ID Token
    // ------------------------------------------

    checkUserWithToken(
      idToken
    );


  }
  catch (error) {

    console.error(
      'LIFF ERROR:',
      error
    );


    showError(
      error.message ||
      'ไม่สามารถเชื่อมต่อ LINE ได้'
    );

  }

}


/**
 * ==========================================
 * ตรวจสอบ User
 * ==========================================
 */
function checkUserWithToken(
  idToken
) {

  showLoading(
    'กำลังตรวจสอบบัญชี LINE...'
  );


  const url =
    GAS_URL +
    '?action=checkUser' +
    '&idToken=' +
    encodeURIComponent(
      idToken
    );


  console.log(
    'Check User URL:',
    url
  );


  fetch(url, {

    method: 'GET',

    redirect: 'follow'

  })

  .then(function(response) {

    if (!response.ok) {

      throw new Error(
        'Server Error: ' +
        response.status
      );

    }

    return response.json();

  })

  .then(function(result) {

    console.log(
      'Check user:',
      result
    );


    if (!result.success) {

      throw new Error(
        result.message ||
        'ไม่สามารถตรวจสอบ User ได้'
      );

    }


    // ----------------------------------------
    // User ลงทะเบียนแล้ว
    // ----------------------------------------

    if (result.registered) {

      currentUser =
        result.user ||
        currentUser;


      showMainPage();

      return;

    }


    // ----------------------------------------
    // User ใหม่
    // ----------------------------------------

    showRegisterPage();

  })

  .catch(function(error) {

    console.error(
      'CHECK USER ERROR:',
      error
    );


    showError(
      error.message ||
      'ไม่สามารถตรวจสอบ User ได้'
    );

  });

}


/**
 * ==========================================
 * โหลด Department
 * ==========================================
 */
function loadDepartments() {

  const select =
    document.getElementById(
      'department'
    );


  if (!select) {
    return;
  }


  select.innerHTML =
    '<option value="">กำลังโหลดแผนก...</option>';


  const url =
    GAS_URL +
    '?action=getDepartments';


  fetch(url)

    .then(function(response) {

      if (!response.ok) {

        throw new Error(
          'ไม่สามารถโหลด Department ได้'
        );

      }

      return response.json();

    })

    .then(function(departments) {

      select.innerHTML =
        '<option value="">-- เลือกแผนก --</option>';


      if (
        !departments ||
        departments.length === 0
      ) {

        select.innerHTML =
          '<option value="">ไม่พบแผนก</option>';

        return;

      }


      departments.forEach(
        function(dept) {

          const option =
            document.createElement(
              'option'
            );


          option.value =
            dept.department_id;


          option.textContent =
            dept.department_name;


          option.dataset.name =
            dept.department_name;


          select.appendChild(
            option
          );

        }
      );

    })

    .catch(function(error) {

      console.error(
        error
      );


      showError(
        error.message ||
        'ไม่สามารถโหลดรายการแผนกได้'
      );

    });

}


/**
 * ==========================================
 * แสดง Register
 * ==========================================
 */
function showRegisterPage() {

  document
    .getElementById('loading')
    .classList.add('hidden');


  document
    .getElementById('registerPage')
    .classList.remove('hidden');


  loadDepartments();

}


/**
 * ==========================================
 * แสดง Main
 * ==========================================
 */
function showMainPage() {

  document
    .getElementById('loading')
    .classList.add('hidden');


  document
    .getElementById('registerPage')
    .classList.add('hidden');


  document
    .getElementById('mainPage')
    .classList.remove('hidden');

}


/**
 * ==========================================
 * Register User
 * ==========================================
 */
function registerUser() {

  hideError();


  const name =
    document
      .getElementById('name')
      .value
      .trim();


  const email =
    document
      .getElementById('email')
      .value
      .trim();


  const department =
    document.getElementById(
      'department'
    );


  const departmentId =
    department.value;


  const selectedOption =
    department.options[
      department.selectedIndex
    ];


  const departmentName =
    selectedOption
      ? (
          selectedOption.dataset.name ||
          ''
        )
      : '';


  // ------------------------------------------
  // Validation
  // ------------------------------------------

  if (!name) {

    showError(
      'กรุณากรอกชื่อ - นามสกุล'
    );

    return;

  }


  if (!email) {

    showError(
      'กรุณากรอก Email'
    );

    return;

  }


  const emailRegex =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


  if (!emailRegex.test(email)) {

    showError(
      'รูปแบบ Email ไม่ถูกต้อง'
    );

    return;

  }


  if (!departmentId) {

    showError(
      'กรุณาเลือกแผนก'
    );

    return;

  }


  if (!currentIdToken) {

    showError(
      'ไม่พบ LINE ID Token กรุณาเปิดระบบใหม่'
    );

    return;

  }


  const button =
    document.getElementById(
      'registerButton'
    );


  button.disabled = true;

  button.textContent =
    'กำลังลงทะเบียน...';


  // ------------------------------------------
  // ส่งเฉพาะ ID Token
  //
  // ไม่ส่ง userId
  // ไม่ส่ง displayName
  // ไม่ส่ง pictureUrl
  // ------------------------------------------

  const payload = {

    idToken:
      currentIdToken,

    name:
      name,

    email:
      email,

    department_id:
      departmentId,

    department_name:
      departmentName

  };


  fetch(
    GAS_URL,
    {

      method: 'POST',

      headers: {

        'Content-Type':
          'text/plain;charset=utf-8'

      },

      body:
        JSON.stringify({

          action:
            'registerUser',

          data:
            payload

        })

    }
  )

  .then(function(response) {

    if (!response.ok) {

      throw new Error(
        'Server Error: ' +
        response.status
      );

    }

    return response.json();

  })

  .then(function(result) {

    console.log(
      'Register result:',
      result
    );


    if (result.success) {

      showMainPage();

      return;

    }


    throw new Error(
      result.message ||
      'ไม่สามารถลงทะเบียนได้'
    );

  })

  .catch(function(error) {

    console.error(
      'REGISTER ERROR:',
      error
    );


    showError(
      error.message ||
      'เกิดข้อผิดพลาดในการลงทะเบียน'
    );


    button.disabled =
      false;


    button.textContent =
      'ลงทะเบียน';

  });

}


/**
 * ==========================================
 * Loading
 * ==========================================
 */
function showLoading(
  message
) {

  const loading =
    document.getElementById(
      'loading'
    );


  if (!loading) {
    return;
  }


  loading.classList.remove(
    'hidden'
  );


  const text =
    loading.querySelector(
      '.text-slate-600'
    );


  if (text) {

    text.textContent =
      message ||
      'กำลังตรวจสอบข้อมูล...';

  }

}


/**
 * ==========================================
 * Error
 * ==========================================
 */
function showError(
  message
) {

  const el =
    document.getElementById(
      'errorMessage'
    );


  if (!el) {

    console.error(
      message
    );

    return;

  }


  el.textContent =
    message;


  el.classList.remove(
    'hidden'
  );


  document
    .getElementById('loading')
    ?.classList.add('hidden');

}


/**
 * ==========================================
 * Hide Error
 * ==========================================
 */
function hideError() {

  const el =
    document.getElementById(
      'errorMessage'
    );


  if (!el) {
    return;
  }


  el.textContent = '';

  el.classList.add(
    'hidden'
  );

}


/**
 * ==========================================
 * ตัวอย่างเปิดหน้าแจ้งซ่อม
 * ==========================================
 */
function openRepair() {

  alert(
    'เปิดหน้าแจ้งซ่อม'
  );

}


/**
 * ==========================================
 * Start
 * ==========================================
 */
document.addEventListener(
